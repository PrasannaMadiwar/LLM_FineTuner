services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-llm_finetuner}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-llm_finetuner}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-llm_finetuner_password}
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    restart: on-failure
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql+asyncpg://llm_finetuner:llm_finetuner_password@postgres:5432/llm_finetuner}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      REDIS_URL: ${LOCAL_REDIS_URL:-redis://redis:6379/0}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:13000,http://localhost:3000,http://localhost:18000}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      GPU_AGENT_TOKEN: ${GPU_AGENT_TOKEN:-change-me-runtime-agent-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPU_PROVIDER: ${GPU_PROVIDER:-local}
      LOCAL_GPU_IMAGE: ${LOCAL_GPU_IMAGE:-llm-finetuner-gpu-agent:local}
      LOCAL_GPU_NETWORK: llm-finetuner-net
      DATASET_MAX_ROWS: ${DATASET_MAX_ROWS:-2000}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_TEMPLATE_ID: ${RUNPOD_TEMPLATE_ID}
      RUNPOD_DEFAULT_GPU: ${RUNPOD_DEFAULT_GPU:-A100}
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    volumes:
      - ./storage:/app/storage
      # Lets the local GPU provider start GPU agent containers. Local demo only:
      # never mount the Docker socket on a publicly reachable server.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build:
      context: ./apps/api
    restart: on-failure
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=1
    environment:
      DATABASE_URL: ${LOCAL_DATABASE_URL:-postgresql+asyncpg://llm_finetuner:llm_finetuner_password@postgres:5432/llm_finetuner}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      REDIS_URL: ${LOCAL_REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${LOCAL_CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${LOCAL_CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      GPU_AGENT_TOKEN: ${GPU_AGENT_TOKEN:-change-me-runtime-agent-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPU_PROVIDER: ${GPU_PROVIDER:-local}
      LOCAL_GPU_IMAGE: ${LOCAL_GPU_IMAGE:-llm-finetuner-gpu-agent:local}
      LOCAL_GPU_NETWORK: llm-finetuner-net
      DATASET_MAX_ROWS: ${DATASET_MAX_ROWS:-2000}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_TEMPLATE_ID: ${RUNPOD_TEMPLATE_ID}
      RUNPOD_DEFAULT_GPU: ${RUNPOD_DEFAULT_GPU:-A100}
    volumes:
      - ./storage:/app/storage
      # Lets the local GPU provider start GPU agent containers. Local demo only:
      # never mount the Docker socket on a publicly reachable server.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000/api/v1}
    ports:
      - "${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

# Fixed name so GPU agent containers started by the local provider can join it.
networks:
  default:
    name: llm-finetuner-net
