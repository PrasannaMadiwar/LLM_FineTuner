services:
  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      REDIS_URL: ${REDIS_URL}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:13000,http://localhost:3000,http://localhost:18000}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      GPU_AGENT_TOKEN: ${GPU_AGENT_TOKEN:-change-me-runtime-agent-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPU_PROVIDER: ${GPU_PROVIDER:-runpod}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_TEMPLATE_ID: ${RUNPOD_TEMPLATE_ID}
      RUNPOD_DEFAULT_GPU: ${RUNPOD_DEFAULT_GPU:-A100}
    ports:
      - "${API_HOST_PORT:-18000}:8000"
    volumes:
      - ./storage:/app/storage
  worker:
    build:
      context: ./apps/api
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}
      REDIS_URL: ${REDIS_URL}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      GPU_AGENT_TOKEN: ${GPU_AGENT_TOKEN:-change-me-runtime-agent-token}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GPU_PROVIDER: ${GPU_PROVIDER:-runpod}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY}
      RUNPOD_TEMPLATE_ID: ${RUNPOD_TEMPLATE_ID}
      RUNPOD_DEFAULT_GPU: ${RUNPOD_DEFAULT_GPU:-A100}
    volumes:
      - ./storage:/app/storage
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000/api/v1}
    ports:
      - "${WEB_HOST_PORT:-13000}:3000"
    depends_on:
      - api
